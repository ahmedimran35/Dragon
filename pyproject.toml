[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dragon"
version = "0.1.0"
description = "Dragon: a self-hosted, web-only personal agent runtime. The agent (Ember), the Sentinel that decides what may run, the optional hands and connectors, and the web app. Bring your own model."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Dragon Contributors" }]
keywords = ["agent", "ai", "llm", "personal-agent", "self-hosted", "dragon", "mcp", "ollama", "openai-compatible"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.60",
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "loguru>=0.7",
  "cryptography>=42",
  "tenacity>=8.3",
  "ddgs>=9.0",
  "beautifulsoup4>=4.12",
  "html2text>=2024.2.26",
  "mcp>=1.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "qrcode>=7.4",
  "pywebpush>=2.0",
  "python-dateutil>=2.9",
  "pillow>=10",
  "pypdf>=4",
  # reading a dsh session store; its own compression.zstd arrives in Python 3.14, and this
  # project supports 3.11 and up
  "zstandard>=0.22",
  # Windows has no system time-zone database; zoneinfo (the calendar, quiet hours) needs this one
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
# the web server stack (`dragon serve`); also part of the base install so every CLI
# command works after `pip install dragon`, this extra exists for `.[server,browser]`
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# the browser tool (dragon/tools/browser.py): Playwright and its Chromium
browser = ["playwright>=1.45"]
# this computer's screen and hands (docs/browser-and-hands.md); xdotool works without them on X11
hands = [
    "mss>=9",
    "Pillow>=10",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    # macOS window mode (dragon/computer/mac_window.py): one app's window, events to its process
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-python-dateutil"]
# chat apps (docs/channels.md); Telegram needs nothing beyond httpx
feishu = ["lark-oapi>=1.5,<2"]
dingtalk = ["dingtalk-stream>=0.24,<1"]
wecom = ["wecom-aibot-sdk-python>=0.1.7,<0.2"]
channels = ["dragon[feishu,dingtalk,wecom]"]
all = ["dragon[server,browser,hands,dev,channels]"]

[project.scripts]
dragon = "dragon.cli:app"

[project.urls]
# Set these once the project has a public home; they are published on PyPI.
# Repository = "https://github.com/<your-org>/dragon"
# Issues = "https://github.com/<your-org>/dragon/issues"
# Changelog = "https://github.com/<your-org>/dragon/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["dragon"]

[tool.hatch.build.targets.wheel.force-include]
"config/config.example.toml" = "dragon/config.example.toml"

[tool.hatch.build.targets.sdist]
include = ["dragon", "config/config.example.toml", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
files = ["dragon"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unreachable = true
# the mcp 1.x/2.x import fallback needs an ignore on whichever branch is not installed
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: tests that call a real LLM endpoint (set DRAGON_LIVE=1)"]
