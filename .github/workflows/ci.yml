name: Test Suite

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Which trees the push touched. Jobs below are skipped, not omitted, when theirs did not
  # change: a skipped required check still satisfies branch protection, a missing one blocks
  # the merge forever. Tag pushes run everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - "dragon/**"
              - "tests/**"
              - "scripts/**"
              - "config/**" # config.example.toml: the tests read it, the image carries it
              - "pyproject.toml"
              - "Dockerfile"
              - ".dockerignore"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - "dragon/server/static/**"
              - "dragon/llm/providers.json" # bundled into the web app (web/src/providers.ts)
              - ".github/workflows/ci.yml"
      # Every npm lock file in the repository, on every pull request, whatever it touched:
      # a private mirror's host must never land in one. pnpm-lock / package-lock record
      # integrity hashes, not private URLs; this keeps it that way.
      - name: Lock files resolve against the public registry only
        run: |
          if grep -HoE '"resolved": "https?://[^/]+' web/package-lock.json | grep -v 'registry.npmjs.org'; then
            echo "web/package-lock.json resolves packages from a host other than registry.npmjs.org (a private mirror leaked in); regenerate it against the public registry" >&2
            exit 1
          fi

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    needs: changes
    # No `if:` on this job. A matrix job skipped as a whole reports one check named with the
    # raw template, never `ubuntu-latest · py3.12`, and a required check that never appears
    # blocks the merge of every docs-only change. The job runs; its steps skip together.
    env:
      RUN: ${{ needs.changes.outputs.python == 'true' || github.ref_type == 'tag' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: env.RUN == 'true'
        with:
          enable-cache: true

      - name: Install
        if: env.RUN == 'true'
        shell: bash
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Install bubblewrap (the sandbox tests run for real on Linux)
        if: env.RUN == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          bwrap --version
          # The boxed tests skip themselves when a namespace cannot be created here.
          bwrap --unshare-all --ro-bind / / -- /bin/true && echo "bubblewrap works here" \
            || echo "bubblewrap cannot create a namespace here; the boxed tests will skip"

      - name: Ruff lint
        if: env.RUN == 'true'
        run: uv run ruff check .

      - name: Ruff format
        if: env.RUN == 'true'
        run: uv run ruff format --check .

      - name: Tests (no live LLM calls)
        if: env.RUN == 'true'
        run: uv run python -m pytest -q -m "not live"

      - name: Package builds and installs
        if: env.RUN == 'true' && (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12')
        shell: bash
        run: |
          uv build
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/dragon --version

  web:
    name: web app
    needs: changes
    # Same shape as `test`: the job always runs so the check always appears; its steps skip
    # together when nothing under web/ changed.
    env:
      RUN: ${{ needs.changes.outputs.web == 'true' || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: env.RUN == 'true'
        run: npm ci
        working-directory: web
      - name: Check (lint, typecheck, tests)
        if: env.RUN == 'true'
        run: npm run check
        working-directory: web
      - name: Build
        if: env.RUN == 'true'
        run: npm run build
        working-directory: web
      - name: Built app is committed
        # dragon/server/static is tracked: the wheel ships the web app. A dependency bump
        # changes the bundle by definition; the rebuild lands right after the merge.
        if: env.RUN == 'true' && github.actor != 'dependabot[bot]'
        run: |
          if [ -n "$(git status --porcelain dragon/server/static)" ]; then
            echo "dragon/server/static is out of date: run 'cd web && npm run build' and commit the result"
            git status --porcelain dragon/server/static
            exit 1
          fi

  # The one rule CI cannot express any other way: no file outside NOTICE/ may name the
  # upstream project this runtime derives from (AGENTS.md, "Brand rules"). The patterns
  # below are written with a character class on purpose — spelled out, this workflow would
  # find itself and fail. With -i they cover every capitalisation of both names.
  brand:
    name: brand guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No upstream names outside NOTICE
        run: |
          set -euo pipefail
          hits=$(grep -rniI --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
            -e "nanom[u]se" -e "nano-m[u]se" . | grep -v "^\./NOTICE" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::only NOTICE may name the upstream project; rename these (AGENTS.md, Brand rules)"
            exit 1
          fi
          echo "clean"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, test]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true' || github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: dragon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm dragon:ci dragon --version
